[package]
name = "tauri-graphql-app"
version = "0.1.0"
description = "Copy-ready Tauri GraphQL application"
edition = "2021"
publish = false
default-run = "tauri-graphql-app"

[lib]
name = "tauri_graphql_app"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
app-schema = { path = "../crates/app-schema" }
tauri = { workspace = true, features = ["macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
tauri-plugin-global-shortcut = "=2.3.2"
tauri-graphql-transport = { path = "../crates/tauri-graphql-transport" }
taurpc.workspace = true

# macOS only, and only for the overlay's window behaviour: Tauri's
# set_visible_on_all_workspaces sets NSWindowCollectionBehaviorCanJoinAllSpaces
# and nothing else, which is not enough to keep a floating overlay on screen
# across Spaces. See src/overlay.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = ["NSWindow", "NSResponder"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true
